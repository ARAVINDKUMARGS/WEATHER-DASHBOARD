<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Station — Weather Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="title">Station<span class="unit-tag">°C · km/h · hPa</span></div>

  <div class="search-panel">
    <form class="search-form" id="searchForm">
      <input type="text" id="cityInput" placeholder="Search a city…" autocomplete="off">
      <button type="submit" class="btn btn-primary">Read</button>
    </form>
    <button type="button" class="btn" id="locateBtn">Use my location</button>
  </div>
</header>

<p class="status-line" id="statusLine"></p>

<main>
  <div class="empty-state" id="emptyState">Search a city or use your location to take a reading.</div>

  <div class="station" id="station">
    <div class="readout">
      <div class="dial-stage">
        <p class="place" id="place">—</p>
        <div class="dial">
          <svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Temperature dial">
            <path d="M20,130 A100,100 0 0 1 220,130" fill="none" stroke="#263344" stroke-width="10" stroke-linecap="round"/>
            <g stroke="#8B97A6" stroke-width="1.5">
              <line x1="20" y1="130" x2="30" y2="130"/>
              <line x1="46" y1="65" x2="53" y2="70"/>
              <line x1="120" y1="30" x2="120" y2="40"/>
              <line x1="194" y1="65" x2="187" y2="70"/>
              <line x1="220" y1="130" x2="210" y2="130"/>
            </g>
            <text x="14" y="150" font-family="IBM Plex Mono" font-size="9" fill="#8B97A6">-20°</text>
            <text x="196" y="150" font-family="IBM Plex Mono" font-size="9" fill="#8B97A6">45°</text>
            <g id="dialNeedle" transform="rotate(0 120 130)">
              <line x1="120" y1="130" x2="120" y2="45" stroke="#E2A33C" stroke-width="3" stroke-linecap="round"/>
              <circle cx="120" cy="130" r="7" fill="#E2A33C"/>
            </g>
          </svg>
        </div>
        <p class="dial-temp" id="dialTemp">—</p>
        <p class="dial-condition" id="dialCondition">—</p>
      </div>

      <div class="stats-grid">
        <div class="stat">
          <div class="stat-label">Feels like</div>
          <div class="stat-value" id="statFeels">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Humidity</div>
          <div class="stat-value" id="statHumidity">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Wind speed</div>
          <div class="stat-value" id="statWind">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Pressure</div>
          <div class="stat-value" id="statPressure">—</div>
        </div>
      </div>
    </div>

    <div class="forecast-head">5-day forecast</div>
    <div class="forecast-strip" id="forecastStrip"></div>
  </div>
</main>

<footer>
  Weather data by Open-Meteo.com — a free, no-key weather API.
</footer>

<script src="script.js"></script>
</body>
</html>
